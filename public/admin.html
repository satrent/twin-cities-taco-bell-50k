<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin | Twin Cities Taco Bell 50k</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin">
  <header class="topbar">
    <a class="wordmark" href="/">TC Taco Bell <span>50k</span></a>
    <nav aria-label="Admin" id="admin-nav" hidden>
      <button type="button" data-tab="dashboard">Dashboard</button>
      <button type="button" data-tab="runners">Runners</button>
      <button type="button" data-tab="notify">Notify list</button>
      <button type="button" data-tab="settings">Settings</button>
      <button type="button" id="logout">Log out</button>
    </nav>
  </header>

  <main class="admin-main">
    <form id="login" class="login" hidden>
      <h1>Race HQ</h1>
      <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <button class="btn btn-primary" type="submit">Log in</button>
    </form>

    <section id="tab-dashboard" hidden></section>

    <section id="tab-runners" hidden>
      <div class="toolbar">
        <h1>Runners</h1>
        <input id="search" type="search" placeholder="Search name, email, bib, code" aria-label="Search runners">
        <select id="filter" aria-label="Filter runners">
          <option value="active">Registered + waitlist</option>
          <option value="registered">Registered</option>
          <option value="unpaid">Registered, unpaid</option>
          <option value="nopacket">Registered, no packet yet</option>
          <option value="waitlist">Waitlist</option>
          <option value="cancelled">Cancelled</option>
          <option value="all">Everyone</option>
        </select>
        <button type="button" class="btn btn-small" id="copy-emails">Copy emails</button>
        <a class="btn btn-small" href="/api/admin/export/registrations.csv">Export CSV</a>
      </div>
      <p class="count" id="runner-count" role="status"></p>
      <div class="table-wrap">
        <table id="runners">
          <thead><tr>
            <th>Name</th><th>Status</th><th>Bib</th><th>Shirt</th><th>Diet</th>
            <th class="c">Paid</th><th class="c">Packet</th><th class="c">Finished</th><th>Signed up</th><th></th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="tab-notify" hidden>
      <div class="toolbar">
        <h1>Notify list</h1>
        <button type="button" class="btn btn-small" id="copy-notify">Copy emails</button>
        <a class="btn btn-small" href="/api/admin/export/notify.csv">Export CSV</a>
      </div>
      <p class="count" id="notify-count" role="status"></p>
      <div class="table-wrap">
        <table id="notify-table">
          <thead><tr><th>Name</th><th>Email</th><th>Signed up</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="tab-settings" hidden>
      <div class="toolbar"><h1>Settings</h1></div>
      <form id="settings" class="settings">
        <label>Registration
          <select name="registration_mode">
            <option value="soon">Coming soon (collects a notify list)</option>
            <option value="open">Open</option>
            <option value="closed">Closed (collects a notify list)</option>
          </select>
        </label>
        <label>Race year <input name="year" inputmode="numeric" required></label>
        <label>Race date <input name="race_date" required></label>
        <label>Start time <input name="start_time" required></label>
        <label>Capacity <input name="capacity" inputmode="numeric" required>
          <small>When this fills, new sign-ups join the waitlist.</small></label>
        <label>Fee (dollars) <input name="fee" inputmode="numeric" required></label>
        <label>Registration deadline <input name="deadline" required></label>
        <label>Refund cutoff <input name="refund_cutoff" required></label>
        <label>Packet pickup dates <input name="packet_pickup" required></label>
        <label class="wide">Payment instructions shown after registering
          <textarea name="payment_instructions" rows="3" required></textarea></label>
        <p class="form-error wide" id="settings-error" role="alert" hidden></p>
        <div class="wide save-row">
          <button class="btn btn-primary" type="submit">Save settings</button>
          <span id="settings-saved" role="status"></span>
        </div>
      </form>
    </section>
  </main>

  <dialog id="detail" aria-labelledby="detail-name"></dialog>
  <script src="/js/admin.js"></script>
</body>
</html>
